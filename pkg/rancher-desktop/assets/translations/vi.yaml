virtualMachine:
  mount:
    type:
      # @source Mount Type
      legend: Loại mount
      options:
        9p:
          # @source Exposes the filesystem by using QEMU's virtio-9p-pci devices.
          description: Chia sẻ hệ thống tệp bằng các thiết bị virtio-9p-pci của QEMU.
          # @reason 9p is a filesystem protocol name and stays in English.
          # @source 9p
          label: 9p
          options:
            cacheMode:
              # @source Cache Mode
              legend: Chế độ cache
              options:
                # @reason 9p cache mode value shown as-is; kept in English.
                # @source fscache
                fscache: fscache
                # @reason 9p cache mode value shown as-is; kept in English.
                # @source loose
                loose: loose
                # @reason 9p cache mode value shown as-is; kept in English.
                # @source mmap
                mmap: mmap
                # @reason 9p cache mode value shown as-is; kept in English.
                # @source none
                none: none
              # @source Caching policy to be used
              tooltip: Chính sách cache được sử dụng
            mSizeInKib:
              # @source Message Size In KiB
              legend: Kích thước thông điệp (KiB)
              # @source Maximum message size in KiB
              tooltip: Kích thước thông điệp tối đa tính bằng KiB
            protocolVersion:
              # @source Protocol Version
              legend: Phiên bản giao thức
              options:
                # @reason 9P protocol version identifier; kept as-is.
                # @source 9p2000
                9p2000: 9p2000
                # @reason 9P protocol version identifier; kept as-is.
                # @source 9p2000.L
                9p2000L: 9p2000.L
                # @reason 9P protocol version identifier; kept as-is.
                # @source 9p2000.u
                9p2000u: 9p2000.u
              # @source 9P protocol version
              tooltip: Phiên bản giao thức 9P
            securityModel:
              # @source Security Model
              legend: Mô hình bảo mật
              options:
                # @reason 9p security model value shown as-is; kept in English.
                # @source mapped-file
                mapped-file: mapped-file
                # @reason 9p security model value shown as-is; kept in English.
                # @source mapped-xattr
                mapped-xattr: mapped-xattr
                # @reason 9p security model value shown as-is; kept in English.
                # @source none
                none: none
                # @reason 9p security model value shown as-is; kept in English.
                # @source passthrough
                passthrough: passthrough
              # @source Security model used for the export path
              tooltip: Mô hình bảo mật được sử dụng cho đường dẫn export
        reverse-sshfs:
          # @source Exposes the filesystem by running an SFTP server.
          description: Chia sẻ hệ thống tệp bằng cách chạy một máy chủ SFTP.
          # @reason reverse-sshfs is the mount type identifier and stays in English.
          # @source reverse-sshfs
          label: reverse-sshfs
        virtiofs:
          # @source Exposes the filesystem by using an Apple Virtualization framework shared directory device.
          description: Chia sẻ hệ thống tệp bằng thiết bị thư mục dùng chung của Apple Virtualization framework.
          # @reason virtiofs is the mount type identifier and stays in English.
          # @source virtiofs
          label: virtiofs
  proxy:
    # @source Address
    address: Địa chỉ
    # @source Proxy address
    addressTitle: Địa chỉ proxy
    # @source Authentication information
    authTitle: Thông tin xác thực
    # @source Enable the proxy used by rancher-desktop
    label: Bật proxy mà rancher-desktop sử dụng
