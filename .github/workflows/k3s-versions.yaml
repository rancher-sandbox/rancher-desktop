name: Update k3s-versions.json
# A pull request or issue created with github.token triggers no other
# workflow, so this uses vault (upstream) or RUN_WORKFLOW_FROM_WORKFLOW.
on:
  schedule:
  - cron: '43 8 * * *'
  workflow_dispatch: {}

permissions:
  # github.token only pushes the branch; the app token opens the PR.
  contents: write
  id-token: write # Required for $/.github/actions/get-token

jobs:
  check-for-token:
    outputs:
      has-token: ${{ steps.calc.outputs.HAS_TOKEN }}
    runs-on: ubuntu-latest
    steps:
    - id: calc
      run: echo "HAS_TOKEN=${HAS_TOKEN}" >> "${GITHUB_OUTPUT}"
      env:
        HAS_TOKEN: ${{ github.repository_owner == 'rancher-sandbox'
          || secrets.RUN_WORKFLOW_FROM_WORKFLOW != '' }}

  check-update-versions:
    needs: check-for-token
    if: needs.check-for-token.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    steps:
    - id: get-token
      uses: $/.github/actions/get-token
      with:
        token-secret: ${{ secrets.RUN_WORKFLOW_FROM_WORKFLOW }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # we may need to checkout an existing branch, so need the full history
        fetch-depth: 0
    # Setup go to be able to run `go run ./scripts/k3s-version.go`
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.work
    - run: ./scripts/k3s-versions.sh
      env:
        GITHUB_TOKEN: ${{ steps.get-token.outputs.token }}
