name: Update external dependencies
# A pull request or issue created with github.token does not trigger
# subsequent workflows, so this uses vault (upstream) or
# RUN_WORKFLOW_FROM_WORKFLOW.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  check-for-token:
    outputs:
      has-token: ${{ steps.calc.outputs.HAS_TOKEN }}
    runs-on: ubuntu-latest
    steps:
    - id: calc
      run: echo "HAS_TOKEN=${HAS_TOKEN}" >> "${GITHUB_OUTPUT}"
      env:
        HAS_TOKEN: ${{ github.repository_owner == 'rancher-sandbox'
          || secrets.RUN_WORKFLOW_FROM_WORKFLOW != '' }}

  check-update-versions:
    needs: check-for-token
    if: needs.check-for-token.outputs.has-token == 'true'
    permissions:
      contents: read
      id-token: write # Required for $/.github/actions/get-token
    runs-on: ubuntu-latest
    steps:
      - id: get-token
        uses: $/.github/actions/get-token
        with:
          token-secret: ${{ secrets.RUN_WORKFLOW_FROM_WORKFLOW }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # rddepman pushes with the app token in the URL; a persisted
          # github.token would override that, so keep it out of git config.
          persist-credentials: false

      - uses: $/.github/actions/yarn-install

      - run: yarn rddepman
        env:
          GITHUB_TOKEN: ${{ steps.get-token.outputs.token }}
