name: BATS
on:
  workflow_dispatch:
    inputs:
      owner:
        description: Override owner (e.g. rancher-sandbox)
        type: string
      repo:
        description: Override repository (e.g. rancher-desktop)
        type: string
      branch:
        description: Override branch (e.g. main, or PR#)
        type: string
      tests:
        description: 'Tests (in the tests/ directory, e.g. "containers")'
        default: '*'
        type: string
      platforms:
        description: Platforms to run
        default: 'linux mac win'
        type: string
      engines:
        description: Container engines to run
        default: 'containerd moby'
        type: string
      kubernetes-version:
        description: Primary Kubernetes version to test
        default: '1.25.16' # Must also change in calculate step
        type: string
      kubernetes-alt-version:
        description: Secondary Kubernetes version to test (e.g. for upgrades)
        default: '1.28.11' # Must also change in calculate step
        type: string
      package-id:
        description: Package run ID override; leave empty to use latest.
        default: ''
        type: string
      experimental:
        description: Run with experimental settings (WSL)
        default: false
        type: boolean
      install-mode:
        description: Install from the installer or from the zip (Windows only)
        default: 'zip'
        type: choice
        options: [ 'installer', 'zip' ]
      # The tests ship inside the package build's bats.tar.gz, so iterating on
      # a test normally needs a full package rebuild.  'checkout' replaces
      # only tests/; bats-core and the bundled jq still come from the package.
      tests-from:
        description: Take the tests from the package build or from this checkout
        default: 'package'
        type: choice
        options: [ 'package', 'checkout' ]
      ramdisk:
        description: Put the VM on a ramdisk (macOS only)
        default: 'false'
        type: choice
        options: [ 'true', 'false' ]
      vz:
        description: Use the Virtualization framework rather than QEMU (macOS only)
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]
  schedule:
  - cron: '0 8 * * 1-5' # 8AM UTC weekdays as a baseline

permissions:
  contents: read

env:
  GH_OWNER:      ${{ github.repository_owner }}
  GH_REPOSITORY: ${{ github.repository }}
  GH_REF_NAME:   ${{ github.ref_name }}

jobs:
  get-tests:
    name: Calculate tests to run
    # A fork that enables this workflow wants the runs it dispatches, not the
    # full nightly matrix against whatever build it last made.
    if: github.event_name != 'schedule' || !github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
    - name: Fetch install script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          scripts/install-latest-ci.sh
          .github/workflows/bats/get-tests.py

    - name: Fetch tests from this checkout
      if: inputs.tests-from == 'checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /.gitattributes
          /bats/tests/
        path: checkout

    - id: repo
      name: Calculate short repository
      run: echo "repo=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

    - name: Fetch tests
      run: |
        : ${OWNER:=$GH_OWNER}
        : ${REPO:=${GH_REPOSITORY#$GH_OWNER/}}
        : ${BRANCH:=$GH_REF_NAME}
        # If BRANCH is a number, assume it is supposed to be a PR
        [[ $BRANCH =~ ^[0-9]+$ ]] && export PR=$BRANCH
        "scripts/install-latest-ci.sh"
      env:
        GH_TOKEN:     ${{ github.token }}
        OWNER:        ${{ inputs.owner || github.repository_owner }}
        REPO:         ${{ inputs.repo || steps.repo.outputs.repo }}
        BRANCH:       ${{ inputs.branch || github.ref_name }}
        ID:           ${{ inputs.package-id }}
        BATS_DIR:     ${{ github.workspace }}/bats
        INSTALL_MODE: skip

    - name: Use the tests from this checkout
      if: inputs.tests-from == 'checkout'
      shell: bash
      run: |
        rm -rf bats/tests
        mv checkout/bats/tests bats/tests

    - name: Calculate tests
      id: calculate
      # This script is not inline to make local testing easier
      run: python3 ${{ github.workspace }}/.github/workflows/bats/get-tests.py
      env:
        TESTS:                  ${{ inputs.tests }}
        PLATFORMS:              ${{ inputs.platforms }}
        ENGINES:                ${{ inputs.engines }}
        KUBERNETES_VERSION:     ${{ inputs.kubernetes-version || '1.25.16' }}
        # rancher/rancher helm chart 2.8.5 supports up to 1.28.*
        KUBERNETES_ALT_VERSION: ${{ inputs.kubernetes-alt-version || '1.28.11' }}
      working-directory: bats/tests
    outputs:
      repo: ${{ steps.repo.outputs.repo }}
      tests: ${{ steps.calculate.outputs.tests }}

  bats:
    needs: get-tests
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.get-tests.outputs.tests )}}
    runs-on: ${{ matrix.host }}
    # A wedged setup or install step would otherwise inherit GitHub's 6-hour
    # default.  Keep this above the Run BATS step's own 120-minute cap so that
    # step times out first and the log collection still runs.
    timeout-minutes: 150
    steps:
    - name: Fetch install script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          scripts/install-latest-ci.sh
          scripts/patch-guest-iso.sh
          .github/actions/setup-environment/action.yaml
          .github/workflows/bats/sanitize-artifact-name.sh

    - name: Fetch tests from this checkout
      if: inputs.tests-from == 'checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /.gitattributes
          /bats/tests/
        path: checkout

    - name: Install latest CI build
      run: |
        : ${OWNER:=$GH_OWNER}
        : ${REPO:=${GH_REPOSITORY#$GH_OWNER/}}
        : ${BRANCH:=$GH_REF_NAME}
        # If BRANCH is a number, assume it is supposed to be a PR
        [[ $BRANCH =~ ^[0-9]+$ ]] && export PR=$BRANCH
        scripts/install-latest-ci.sh
      shell: bash
      env:
        GH_TOKEN:     ${{ github.token }}
        OWNER:        ${{ inputs.owner || github.repository_owner }}
        REPO:         ${{ inputs.repo || needs.get-tests.outputs.repo }}
        BRANCH:       ${{ inputs.branch || github.ref_name }}
        ID:           ${{ inputs.package-id }}
        BATS_DIR:     ${{ github.workspace }}/bats
        INSTALL_MODE: ${{ inputs.install-mode || 'zip' }}
        ZIP_NAME:     ${{ github.workspace }}/version.txt
        RD_LOCATION:  system

    - name: Use the tests from this checkout
      if: inputs.tests-from == 'checkout'
      shell: bash
      run: |
        rm -rf bats/tests
        mv checkout/bats/tests bats/tests

    - name: "Linux: Identify the user that runs the tests"
      if: runner.os == 'Linux'
      shell: bash
      run: echo "TEST_USER=$(id --user --name)" >> "$GITHUB_ENV"

    - name: Set up environment
      uses: $/.github/actions/setup-environment
      with:
        user: ${{ env.TEST_USER }}

    - name: "Linux: Install prerequisites"
      if: runner.os == 'Linux'
      run: >-
        sudo DEBIAN_FRONTEND=noninteractive
        apt-get install coreutils

    - name: "macOS: Install prerequisites"
      if: runner.os == 'macOS'
      shell: bash
      run: brew install --force bash coreutils

    - name: "macOS: Give the guest the host's TSC frequency"
      if: runner.os == 'macOS'
      shell: bash
      # The runner is itself a VM, so the guest cannot calibrate its TSC and
      # falls back to the HPET, where every clock read traps out to the
      # hypervisor.  tsc_early_khz= hands the kernel the frequency instead,
      # and tsc=reliable stops the watchdog demoting it again.
      run: scripts/patch-guest-iso.sh tsc_early_khz=auto tsc=reliable

    - name: "macOS: Disable Spotlight indexing"
      if: runner.os == 'macOS'
      shell: bash
      # Measured in rancher-desktop-2 on the same macos-15-intel runners:
      # mds/mds_stores/mdworker_shared together took ~230% CPU during a BATS
      # run, more than two of the runner's four cores, leaving the VM too
      # little to boot in.
      run: sudo mdutil -a -i off

    - name: "Linux: Size the VM for the runner"
      if: runner.os == 'Linux'
      shell: bash
      # rancher-desktop-2 found the host side idle at the 2-vCPU default, so
      # give the guest every core except the one the runner agent needs.
      run: echo "RD_VM_CPUS=$(( $(nproc) - 1 ))" >> "$GITHUB_ENV"

    - name: "macOS: Size the VM for the runner"
      if: runner.os == 'macOS'
      shell: bash
      # The 2-vCPU default starves the guest on the 4-core macos-15-intel
      # runners: kubelet overran its 1s housekeeping loop 213 times in run
      # 34006415289, worst case 9.92s, and the apiserver could not finish a
      # TLS handshake with a client on the same host.  rancher-desktop-2
      # measured 4 vCPUs reaching pod-Running 2-3x faster than 3, with the
      # runner agent still scheduled; drop to 3 if runs lose their runner.
      run: echo "RD_VM_CPUS=4" >> "$GITHUB_ENV"

    - name: "Windows: Install WSL2 Distribution"
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Install a "modern" WSL distribution
        wsl --install --no-launch --web-download --name openSUSE openSUSE-Leap-16.0
        # Prevent first-boot from running
        wsl --distribution openSUSE --user root --exec sed -i -e '/^command/d' /etc/wsl-distribution.conf
        # Create the initial user
        wsl --distribution openSUSE --user root --exec /usr/sbin/useradd --create-home --uid 1000 user

    - name: "Windows: Install prerequisites in WSL"
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # cdn.opensuse.org intermittently answers 403 for the repo metadata.
        # zypper carries on, reports every package as missing, and exits 1,
        # which loses the job before any test runs.
        #
        # Actions prepends "$ErrorActionPreference = 'stop'", under which a
        # failing native command throws and would abort the loop on the first
        # attempt, so turn that off for the retry.
        $ErrorActionPreference = 'Continue'
        $PSNativeCommandUseErrorActionPreference = $false
        foreach ($attempt in 1..3) {
            wsl.exe --distribution openSUSE --user root --exec zypper --non-interactive install curl netcat-openbsd openssl util-linux
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "zypper install failed (attempt $attempt)"
            if ($attempt -lt 3) { Start-Sleep -Seconds ($attempt * 15) }
        }
        exit 1

    - name: "Windows: Enable experimental WSL settings"
      if: runner.os == 'Windows' && inputs.experimental
      shell: pwsh
      run: |
        Set-Content -Encoding UTF8NoBOM -Path "${HOME}/.wslconfig" -Value @"
        ; Note that not all settings here make sense together.
        [wsl]
        dnsProxy=false
        ; networkingMode=mirrored ; https://github.com/rancher-sandbox/rancher-desktop/issues/6665
        firewall=true
        dnsTunneling=true
        autoProxy=true
        [experimental]
        autoMemoryReclaim=gradual
        sparseVhd=true
        useWindowsDnsCache=true
        bestEffortDnsParsing=true
        hostAddressLoopback=true
        "@

    - name: Set log directory
      shell: bash
      run: |
        echo "LOGS_DIR=$(pwd)/logs" >> "$GITHUB_ENV"
        mkdir logs
    - name: "Windows: Override log directory"
      if: runner.os == 'Windows'
      shell: powershell
      run: >-
        wsl.exe --distribution openSUSE -- echo 'LOGS_DIR=$(pwd)'
        | Out-File -Encoding ASCII -Append "$ENV:GITHUB_ENV"
      working-directory: logs

    - name: Normalize test name
      id: normalize
      shell: bash
      run: |
        t="${{ matrix.name }}"
        if [[ ! -r "tests/$t" ]] && [[ -r "tests/${t}.bats" ]]; then
          t="${t}.bats"
        fi
        echo "test=$t" >> "$GITHUB_OUTPUT"
      working-directory: bats

    - name: "macOS: Set startup command"
      if: runner.os == 'macOS'
      run: echo "BATS_COMMAND=$BATS_COMMAND" >> "$GITHUB_ENV"
      env:
        BATS_COMMAND: exec
    - name: "Linux: Set startup command"
      if: runner.os == 'Linux'
      run: echo "BATS_COMMAND=$BATS_COMMAND" >> "$GITHUB_ENV"
      env:
        BATS_COMMAND: >-
          exec xvfb-run --auto-servernum
          --server-args='-screen 0 1280x960x24'
    - name: "Windows: Set startup command"
      if: runner.os == 'Windows'
      shell: bash
      run: echo "BATS_COMMAND=$BATS_COMMAND" >> "$GITHUB_ENV"
      env:
        BATS_COMMAND: wsl.exe --distribution openSUSE --exec

    - name: "Windows: Ensure WSL interop is registered"
      if: runner.os == 'Windows'
      shell: pwsh
      # binfmt_misc is one kernel-global registry for the whole WSL VM, and
      # systemd-shutdown wipes it when a systemd distro stops, taking
      # WSLInterop with it (microsoft/WSL f67086e3d).  Without that handler
      # paths.bash cannot run powershell.exe, every Windows path resolves to
      # an empty string, and the suite dies before its first test.  That fix
      # reached only the 2.9 pre-release line, so the 2.7.13 that
      # `wsl --update` installs still needs this.  The binfmt.d file gets the
      # handler back at the next boot, the direct write covers this one.
      run: >-
        wsl.exe --distribution openSUSE --user root --exec /bin/sh -c
        'entry=":WSLInterop:M::MZ::/init:FP";
        printf "%s\n" "$entry" > /etc/binfmt.d/WSLInterop.conf;
        i=0;
        while [ $i -lt 10 ] && ! ls /proc/sys/fs/binfmt_misc/WSLInterop* >/dev/null 2>&1;
        do i=$((i+1)); sleep 1; done;
        if ls /proc/sys/fs/binfmt_misc/WSLInterop* >/dev/null 2>&1;
        then echo "handler present after ${i}s";
        else echo "no handler after ${i}s, registering it";
        printf "%s\n" "$entry" > /proc/sys/fs/binfmt_misc/register;
        fi;
        ls -la /proc/sys/fs/binfmt_misc/'
      continue-on-error: true

    - name: Run BATS
      # We use ${{ env.BATS_COMMAND }} instead of ${BATS_COMMAND} to let the
      # shell parse the command, instead of doing it via expansion which is then
      # parsed differently (--server-args isn't kept as one word).  Also, we
      # need to use the env.* form because PowerShell uses ${ENV:VAR} instead.
      run: >-
        ${{ env.BATS_COMMAND }}
        ./bats-core/bin/bats
        --gather-test-outputs-in '${{ env.LOGS_DIR }}'
        --print-output-on-failure
        --filter-tags '!ci-skip'
        --formatter cat
        --report-formatter tap
        'tests/${{ steps.normalize.outputs.test }}'
      env:
        BATS_COMMAND:              ${{ env.BATS_COMMAND }}
        GITHUB_TOKEN:              ${{ github.token }}
        LOGS_DIR:                  ${{ env.LOGS_DIR }}
        RD_CAPTURE_LOGS:           "true"
        RD_CONTAINER_ENGINE:       ${{ matrix.engine }}
        RD_KUBERNETES_VERSION:     ${{ matrix.k3sVersion }}
        RD_KUBERNETES_ALT_VERSION: ${{ matrix.k3sAltVersion }}
        RD_TAKE_SCREENSHOTS:       "true"
        RD_TRACE:                  "true"
        RD_USE_GHCR_IMAGES:        "true"
        RD_USE_RAMDISK:            ${{ inputs.ramdisk || 'false' }}
        # Empty everywhere but macOS: defaults.bash rejects the variable on a
        # platform that has no Virtualization framework.
        RD_USE_VZ_EMULATION:       ${{ runner.os == 'macOS' && inputs.vz || '' }}
        RD_USE_WINDOWS_EXE:        "${{ runner.os == 'Windows' }}"
        # The macOS runners are the slow ones; see RD_WAIT_FACTOR in
        # bats/tests/helpers/defaults.bash.
        RD_WAIT_FACTOR:            ${{ runner.os == 'macOS' && '2' || '1' }}
        WSLENV: "\
          GITHUB_TOKEN:\
          RD_CAPTURE_LOGS:\
          RD_CONTAINER_ENGINE:\
          RD_KUBERNETES_VERSION:\
          RD_KUBERNETES_ALT_VERSION:\
          RD_TAKE_SCREENSHOTS:\
          RD_TRACE:\
          RD_USE_GHCR_IMAGES:\
          RD_USE_RAMDISK:\
          RD_USE_WINDOWS_EXE:\
          RD_WAIT_FACTOR:\
          "
      working-directory: bats
      timeout-minutes: 120

    - name: Calculate log name
      id: log_name
      if: ${{ !cancelled() }}
      run: |
        name="$(.github/workflows/bats/sanitize-artifact-name.sh <<< "$name")"
        # For the artifact name, backslash and forward slash are also invalid.
        name=${name//\\/%3C}
        name=${name//\//%2F}
        echo "name=$name" >>"$GITHUB_OUTPUT"
      shell: bash
      env:
        name: ${{ matrix.host }}-${{ matrix.engine }}-${{ matrix.name }}.logs

    - name: Consolidate logs
      if: ${{ !cancelled() }}
      run: |
        # bats/logs may not exist if the workflow is being tested with e.g. tests/helpers/utils.bats
        if [ -d "bats/logs" ]; then
            cp -R "bats/logs/" logs
        fi
        cp "bats/report.tap" logs
        .github/workflows/bats/sanitize-artifact-name.sh logs
        echo "$NAME" > logs/name.txt
        echo "$OS" > logs/os.txt
        echo "$ENGINE" > logs/engine.txt
        echo "$LOG_NAME" > logs/log-name.txt
        mv version.txt logs/
      shell: bash
      env:
        NAME: ${{ matrix.name }}
        OS: ${{ matrix.host }}
        ENGINE: ${{ matrix.engine }}
        LOG_NAME: ${{ steps.log_name.outputs.name }}

    - name: Upload logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.log_name.outputs.name }}
        path: logs/
        if-no-files-found: error

  summarize:
    name: Summarize output
    needs: [ get-tests, bats ]
    # The fork guard skips get-tests on a fork's nightly, and then there is
    # nothing to summarize.
    if: ${{ !cancelled() && needs.get-tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - name: Fetch summarizer script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          package.json
          .github/workflows/bats/summarize.mjs
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: "*.logs"
    - run: node .github/workflows/bats/summarize.mjs
      env:
        EXPECTED_TESTS: ${{ needs.get-tests.outputs.tests }}
        GITHUB_TOKEN:   ${{ github.token }}
